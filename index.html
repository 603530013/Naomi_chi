<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國語練習 ｜ 選擇學期</title>
<style>
  :root{
    --pink:#ffd6e0;--pink-dark:#e85a8a;
    --blue:#cfe8ff;--blue-dark:#1976d2;
    --green:#c8e6c9;--green-dark:#4caf50;
    --yellow:#fff4c2;--yellow-dark:#f5a623;
    --purple:#e1d5f5;--purple-dark:#7b3fa0;
    --orange:#ffd9b3;--orange-dark:#e67700;
    --teal:#b2ebf2;--teal-dark:#00838f;
  }
  *{box-sizing:border-box;}
  body{font-family:"標楷體","DFKai-SB","BiauKai","KaiTi","微軟正黑體",serif;margin:0;padding:0;background:#fefcf7;color:#333;min-height:100vh;}
  .container{max-width:900px;margin:0 auto;padding:40px 24px;}
  header{background:linear-gradient(135deg,#ffd6e0 0%,#cfe8ff 50%,#c8e6c9 100%);padding:44px 24px;text-align:center;border-radius:20px;margin-bottom:36px;box-shadow:0 4px 14px rgba(0,0,0,0.09);}
  header h1{font-size:2.8em;margin:0 0 10px;color:var(--pink-dark);}
  header .subtitle{font-size:1.15em;color:#666;}
  .dashboard-link{display:inline-block;background:rgba(255,255,255,0.75);color:var(--blue-dark);padding:8px 22px;border-radius:20px;text-decoration:none;font-size:1em;font-weight:bold;margin-top:16px;border:2px solid var(--blue-dark);transition:background .2s,color .2s;}
  .dashboard-link:hover{background:var(--blue-dark);color:#fff;}
  .semester-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px;}
  @media(max-width:600px){.semester-grid{grid-template-columns:1fr;}}
  .semester-card{display:block;text-decoration:none;color:inherit;border-radius:22px;padding:38px 28px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.10);transition:transform .2s,box-shadow .2s;border:4px solid transparent;position:relative;overflow:hidden;}
  .semester-card:hover{transform:translateY(-6px);box-shadow:0 10px 28px rgba(0,0,0,0.14);}
  .card-114{background:linear-gradient(145deg,#ffd6e0,#fff4c2);border-color:var(--pink-dark);}
  .card-115{background:linear-gradient(145deg,#cfe8ff,#c8e6c9);border-color:var(--teal-dark);}
  .card-year{font-size:1.05em;font-weight:bold;margin-bottom:6px;opacity:.7;}
  .card-114 .card-year{color:var(--pink-dark);}
  .card-115 .card-year{color:var(--teal-dark);}
  .card-grade{font-size:1.9em;font-weight:bold;margin:10px 0 4px;}
  .card-114 .card-grade{color:var(--pink-dark);}
  .card-115 .card-grade{color:var(--teal-dark);}
  .card-semester{font-size:1.3em;color:#555;margin-bottom:16px;}
  .card-lessons{font-size:1em;color:#888;background:rgba(255,255,255,0.6);border-radius:12px;padding:6px 14px;display:inline-block;}
  .card-badge{position:absolute;top:16px;right:16px;font-size:.85em;padding:4px 10px;border-radius:10px;font-weight:bold;}
  .card-114 .card-badge{background:var(--pink);color:var(--pink-dark);}
  .card-115 .card-badge{background:var(--teal);color:var(--teal-dark);}
  footer{text-align:center;padding:28px;color:#bbb;font-size:.9em;margin-top:40px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>國語練習</h1>
    <div class="subtitle">請選擇學期</div>
    <a class="dashboard-link" href="https://603530013.github.io/game_dashboard/" target="_self">← 回 Dashboard</a>
  </header>

  <div class="semester-grid">

    <a class="semester-card card-114" href="114-2-index.html">
      <span class="card-badge">✓ 已完成</span>
      <div class="card-year">114 學年度</div>
      <div class="card-grade">一年級</div>
      <div class="card-semester">下學期（114-2）</div>
      <div class="card-lessons">第 1～12 課　＋　期中／期末複習</div>
    </a>

    <a class="semester-card card-115" href="115-1/index.html">
      <span class="card-badge">✓ 已完成</span>
      <div class="card-year">115 學年度</div>
      <div class="card-grade">二年級</div>
      <div class="card-semester">上學期（115-1）</div>
      <div class="card-lessons">第 1～12 課</div>
    </a>

  </div>

  <footer>國語自學練習　｜　Naomi 加油！</footer>
</div>
</body>
</html>
